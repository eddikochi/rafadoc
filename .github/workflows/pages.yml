# Publica a pasta public/ no GitHub Pages (validação antes do Cloudflare).
# Roda a cada push nas branches abaixo; também pode ser disparado manualmente (Actions → Run workflow).
name: Pages

on:
  push:
    branches: [vistoria-golive, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
